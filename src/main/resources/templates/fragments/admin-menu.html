<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="menu(active)" class="w-full lg:w-64 shrink-0 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-6">

    <!-- 관리자 프로필 / 타이틀 영역 -->
    <div class="flex flex-col items-center text-center pb-5 border-b border-slate-100">
        <div class="w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center mb-3 shadow-md">
            <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <div class="font-bold text-slate-900 text-base">ReviewRo ADMIN</div>
        <div class="text-xs text-slate-400 mt-0.5">시스템 최고 관리자</div>
    </div>

    <!-- 네비게이션 메뉴 목록 -->
    <nav class="space-y-1 text-xs font-semibold">
        <!-- 관리자 대시보드 -->
        <a th:href="@{/admin}"
           th:classappend="${active == 'dashboard'} ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드
        </a>

        <!-- 회원 관리 -->
        <a th:href="@{/admin/members}"
           th:classappend="${active == 'members'} ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="users" class="w-4 h-4"></i> 회원 관리
        </a>

        <!-- 챌린지 관리 -->
        <a th:href="@{/challengelist}"
           th:classappend="${active == 'challenges'} ? 'bg-amber-50 text-amber-600 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="trophy" class="w-4 h-4"></i> 챌린지 관리
        </a>

        <!-- 장소 관리 -->
        <a th:href="@{/admin/location}"
           th:classappend="${active == 'location'} ? 'bg-emerald-50 text-emerald-600 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="map-pin" class="w-4 h-4"></i> 장소 관리
        </a>

        <!-- 공지게시판 관리 -->
        <a th:href="@{/admin/post/list}"
           th:classappend="${active == 'notices'} ? 'bg-indigo-50 text-indigo-600 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="megaphone" class="w-4 h-4"></i> 공지게시판 관리
        </a>

        <!-- 이용약관 수정 (슈퍼어드민만) -->
        <a th:if="${loginMember != null and loginMember.memberRole.name() == 'SUPERADMIN'}" th:href="@{/admin/terms}"
           th:classappend="${active == 'terms'} ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="file-text" class="w-4 h-4"></i> 이용약관 수정
        </a>

        <!-- AI 설정 (슈퍼어드민만) -->
        <a th:if="${loginMember != null and loginMember.memberRole.name() == 'SUPERADMIN'}" th:href="@{/admin/ai}"
           th:classappend="${active == 'ai'} ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl transition-colors">
            <i data-lucide="sparkles" class="w-4 h-4"></i> AI 설정
        </a>
    </nav>

</aside>

</body>
</html>
