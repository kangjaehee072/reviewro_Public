<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('이용약관·개인정보 처리방침')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="main">
    <div class="wrap terms-page">
        <h1>이용약관·개인정보 처리방침</h1>

        <!-- 목차 -->
        <nav class="terms-toc" th:unless="${#lists.isEmpty(sections)}">
            <a th:each="s : ${sections}" th:href="'#section-' + ${s.termsSectionId}" th:text="${s.title}">이용약관</a>
        </nav>

        <section th:each="s : ${sections}" class="card terms-section" th:id="'section-' + ${s.termsSectionId}">
            <div class="card-body">
                <h2 th:text="${s.title}">이용약관</h2>
                <p class="terms-text" th:text="${s.content}">내용</p>
            </div>
        </section>

        <section class="card terms-section">
            <div class="card-body">
                <div th:replace="~{fragments/terms :: officer(${siteInfo})}"></div>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
