<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('새 여행 계획 등록')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewRo - 새 여행 계획 등록</title>

</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between bg-slate-100">

<!-- Nav / Header 영역 -->
<header th:replace="~{fragments/layout :: header('contents')}"></header>

<!-- Main Container (사이드바 & 메인 영역 분리) -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
    <div class="flex flex-col lg:flex-row items-start gap-6">

        <!-- ==================== [좌측 마이페이지 사이드바] ==================== -->
        <aside th:replace="~{fragments/mypage-menu :: menu('plans')}"></aside>

        <!-- ==================== [우측 메인 콘텐츠 영역] ==================== -->
        <section class="flex-1 w-full space-y-6">

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
                <!-- 페이지 타이틀 -->
                <div class="pb-4 border-b border-slate-100">
                    <h1 class="text-xl font-bold text-slate-900" th:text="${travelPlansDTO.planId != null ? '여행 계획 수정' : '새 여행 계획 등록'}">새 여행 계획 등록</h1>
                    <p class="text-xs text-slate-500 mt-0.5" th:text="${travelPlansDTO.planId != null ? '등록된 여행 일정과 세부 계획을 수정하세요.' : '다녀올 여행 일정과 세부 계획을 등록하세요.'}">다녀올 여행 일정과 세부 계획을 등록하세요.</p>
                </div>

                <!-- 에러 메시지 알림 -->
                <div th:if="${errorMessage}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-semibold shadow-sm" th:text="${errorMessage}"></div>

                <!-- 폼 시작 (Form Binding) -->
                <form th:action="@{/mypage/plans/insert}" th:object="${travelPlansDTO}" method="post" class="space-y-6 text-xs">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" th:if="${travelPlansDTO.planId != null}" th:field="*{planId}"/>
                    <!-- 2블록 분할 (화면 크기가 줄어들면 세로 나열) -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                        <!-- 블록 1: 여행 기본 설정 (제목, 일정 기간, 인원, 여행 유형) -->
                        <div class="space-y-4 bg-slate-50/50 p-5 rounded-xl border border-slate-100 flex flex-col justify-between">
                            <div class="space-y-4">
                                <h3 class="font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                                    <i data-lucide="compass" class="w-4 h-4 text-blue-600"></i> 여행 기본 정보
                                </h3>

                                <!-- 여행 제목 -->
                                <div class="space-y-1.5">
                                    <label for="planTitle" class="block font-semibold text-slate-700">
                                        여행 제목 <span class="text-red-500">*</span>
                                    </label>
                                    <input type="text" id="planTitle" th:field="*{planTitle}"
                                           placeholder="예: 제주도 3박 4일 힐링 여행" required
                                           class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500">
                                </div>

                                <!-- 여행 일정 (시작일 ~ 종료일) -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div class="space-y-1.5">
                                        <label for="planStartDate" class="block font-semibold text-slate-700">
                                            여행 시작일 <span class="text-red-500">*</span>
                                        </label>
                                        <input type="date" id="planStartDate" th:field="*{planStartDate}" required
                                               class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500">
                                    </div>
                                    <div class="space-y-1.5">
                                        <label for="planEndDate" class="block font-semibold text-slate-700">
                                            여행 종료일 <span class="text-red-500">*</span>
                                        </label>
                                        <input type="date" id="planEndDate" th:field="*{planEndDate}" required
                                               class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500">
                                    </div>
                                </div>

                                <!-- 동반 인원 & 여행 유형 -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div class="space-y-1.5">
                                        <label for="planMember" class="block font-semibold text-slate-700">동반 인원</label>
                                        <select id="planMember" th:field="*{planMember}"
                                                class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500">
                                            <option value="혼자 (1인)">혼자 (1인)</option>
                                            <option value="2인">2인</option>
                                            <option value="3~4인">3~4인</option>
                                            <option value="5인 이상 단체">5인 이상 단체</option>
                                        </select>
                                    </div>
                                    <div class="space-y-1.5">
                                        <label for="planType" class="block font-semibold text-slate-700">여행 스타일</label>
                                        <select id="planType" th:field="*{planType}"
                                                class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500">
                                            <option value="자유 여행">자유 여행</option>
                                            <option value="가족 여행">가족 여행</option>
                                            <option value="커플/우정 여행">커플/우정 여행</option>
                                            <option value="식도락/맛집">식도락/맛집</option>
                                            <option value="휴양/힐링">휴양/힐링</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="text-[11px] text-slate-400 pt-2">
                                * 작성된 일정은 내 여행 계획 목록에서 언제든지 조회할 수 있습니다.
                            </div>
                        </div>

                        <!-- 블록 2: 여행 상세 설명 / 메모 -->
                        <div class="space-y-4 bg-slate-50/50 p-5 rounded-xl border border-slate-100 flex flex-col justify-between">
                            <div class="space-y-4 h-full flex flex-col">
                                <h3 class="font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                                    <i data-lucide="file-text" class="w-4 h-4 text-blue-600"></i> 세부 계획 및 메모
                                </h3>

                                <div class="space-y-1.5 flex-1 flex flex-col">
                                    <label for="planDescription" class="block font-semibold text-slate-700">
                                        상세 메모 / 체크리스트
                                    </label>
                                    <textarea id="planDescription" th:field="*{planDescription}" rows="8"
                                              placeholder="방문할 주요 장소, 준비물, 예상 비용 등을 메모해보세요."
                                              class="w-full flex-1 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- 하단 버튼 영역 -->
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-2">
                        <a th:href="@{/mypage/travelplan}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-colors">취소</a>
                        <!-- 제출 버튼 텍스트 동적 변경 -->
                        <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition-all"
                                th:text="${travelPlansDTO.planId != null ? '수정하기' : '저장하기'}">저장하기</button>
                    </div>

                </form>

            </div>

        </section>

    </div>
</main>

<!-- Footer 영역 -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- Script Initialization -->
<script>
    lucide.createIcons();
</script>
</body>
</html>
