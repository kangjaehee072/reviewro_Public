<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="main">
    <div class="wrap">
        <div class="auth">
            <h1>로그인</h1>
            <div class="card">
                <div class="card-body">
                    <div th:if="${successMessage}" class="notice notice-ok" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>
                    <div th:if="${param.next != null and param.next[0] == '/account/link'}" class="notice notice-ok">
                        아이디·비밀번호로 가입한 계정으로 로그인하면 계정 연동 화면으로 이동해요.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- 로그인 뒤 갈 곳 (LoginSuccessHandler 가 우리 사이트 경로만 받는다) -->
                        <input type="hidden" name="next" th:if="${param.next != null}" th:value="${param.next[0]}">
                        <div class="field">
                            <label for="memberUserId">아이디</label>
                            <input type="text" id="memberUserId" name="memberUserId" placeholder="아이디" required autofocus autocomplete="username">
                        </div>
                        <div class="field">
                            <label for="memberPassword">비밀번호</label>
                            <input type="password" id="memberPassword" name="memberPassword" placeholder="비밀번호" required autocomplete="current-password">
                        </div>
                        <!-- 이 기기에서만 로그인 유지 (소셜 버튼을 눌러도 이 체크를 따른다) -->
                        <div class="check-row">
                            <input type="checkbox" id="rememberMe" name="remember-me" value="true">
                            <label for="rememberMe">자동 로그인</label>
                        </div>
                        <button type="submit" class="btn btn-lg btn-primary btn-full">로그인</button>
                    </form>
                    <!-- 연동하러 온 거면 소셜 버튼은 숨긴다 (아이디 계정으로 먼저 들어와야 한다) -->
                    <th:block th:unless="${param.next != null and param.next[0] == '/account/link'}">
                        <th:block th:replace="~{fragments/social :: buttons('간편 로그인')}"></th:block>
                    </th:block>
                </div>
            </div>
            <p class="auth-foot">아직 계정이 없으신가요?<a th:href="@{/signup}">회원가입</a></p>
            <p class="auth-link-account"><a th:href="@{/login(next='/account/link')}">계정 연동하기</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
