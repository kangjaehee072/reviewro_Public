<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('일정 공유하기')}"></head>
<link rel="stylesheet" th:href="@{/css/board.css}">
<body>
<header th:replace="~{fragments/layout :: header('community')}"></header>

<main class="main board board-market">
    <div class="wrap">
        <div class="board-form">

            <a th:href="@{/tripplan/list}" class="back-link"><i data-lucide="chevron-left" class="ico"></i>일정 템플릿 마켓</a>
            <div class="board-form-head">
                <h1>내 일정 공유하기</h1>
                <p>일자를 추가하고 그 안에 장소를 담아 보세요</p>
            </div>

            <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>

            <form class="card" th:action="@{/tripplan/insert}" method="post" th:object="${tripPlanDto}">

                <section class="form-section">
                    <h2 class="form-section-title"><i data-lucide="file-text" class="ico"></i>소개</h2>

                    <div class="field">
                        <label for="tripplanTitle">제목<span class="req">*</span></label>
                        <input type="text" id="tripplanTitle" th:field="*{tripplanTitle}"
                               placeholder="예: 부산 2박 3일 바다 따라 걷기" required>
                    </div>

                    <div class="field">
                        <label for="tripplanContent">소개<span class="req">*</span></label>
                        <textarea id="tripplanContent" th:field="*{tripplanContent}" rows="5" required
                                  placeholder="어떤 사람에게 맞는 일정인지, 꼭 챙길 팁은 무엇인지 적어 주세요"></textarea>
                    </div>

                    <label class="toggle-row" for="tripplanIsPublic">
                        <input type="checkbox" id="tripplanIsPublic" th:field="*{tripplanIsPublic}">
                        <span><b>마켓에 공개</b><small>끄면 나만 볼 수 있어요</small></span>
                    </label>
                </section>

                <section class="form-section">
                    <div class="row-between">
                        <h2 class="form-section-title"><i data-lucide="calendar-days" class="ico"></i>일정</h2>
                        <button type="button" class="btn btn-sm btn-board" onclick="addDay()">
                            <i data-lucide="plus" class="ico"></i>일자 추가
                        </button>
                    </div>

                    <div id="dayContainer"></div>
                    <p class="hint">일자 추가를 눌러 DAY 1 부터 채워 보세요.</p>
                </section>

                <div class="board-form-foot">
                    <a th:href="@{/tripplan/list}" class="btn btn-line">취소</a>
                    <button type="submit" class="btn btn-board"><i data-lucide="check" class="ico"></i>공유하기</button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/tripplan-editor.js}"></script>
<th:block th:replace="~{fragments/board :: icons}"></th:block>
</body>
</html>
