<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('개인정보 변경')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('mypage')}"></header>

<main class="main">
    <div class="wrap mypage">
        <aside th:replace="~{fragments/mypage-menu :: menu('edit')}"></aside>

        <section class="mypage-content">
            <div class="page-head">
                <div>
                    <h1>개인정보 변경</h1>
                    <p>닉네임, 연락처, 비밀번호 등을 수정할 수 있어요</p>
                </div>
            </div>

            <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/mypage/edit}" th:object="${memberDto}" method="post" enctype="multipart/form-data">
                        <div class="profile-row" style="margin-bottom: 20px;">
                            <img id="memberProfilePreview" alt=""
                                 th:src="${loginMember.memberProfileImagePath != null} ? ${loginMember.memberProfileImagePath} : @{/img/default-profile.svg}">
                            <div class="field">
                                <label for="memberProfileImage">프로필 사진<span class="opt">선택</span></label>
                                <input type="file" id="memberProfileImage" th:field="*{memberProfileImage}" accept="image/*">
                            </div>
                        </div>
                        <div class="field">
                            <label for="memberUserId">아이디</label>
                            <input type="text" id="memberUserId" th:value="${loginMember.memberUserId}" disabled>
                        </div>
                        <div class="field">
                            <label for="memberNickname">닉네임<span class="req">*</span></label>
                            <input type="text" id="memberNickname" th:field="*{memberNickname}" required maxlength="30">
                        </div>
                        <div class="field">
                            <label for="memberEmail">이메일<span class="req">*</span></label>
                            <input type="email" id="memberEmail" th:field="*{memberEmail}" required autocomplete="email">
                        </div>
                        <div class="field">
                            <label for="memberPhone">연락처</label>
                            <input type="tel" id="memberPhone" th:field="*{memberPhone}" placeholder="010-0000-0000" autocomplete="tel">
                        </div>
                        <div class="field">
                            <label for="memberAddress">주소</label>
                            <input type="text" id="memberAddress" th:field="*{memberAddress}" placeholder="주소">
                        </div>

                        <hr class="form-divider">

                        <!-- 소셜 가입 회원은 비밀번호가 없다 (카카오·구글·네이버로만 로그인) -->
                        <p th:if="${loginMember.social}" class="hint"
                           th:text="${loginMember.memberProvider.name() == 'KAKAO' ? '카카오' : (loginMember.memberProvider.name() == 'NAVER' ? '네이버' : '구글')} + ' 계정으로 가입해서 비밀번호 없이 로그인해요.'">
                            카카오 계정으로 가입해서 비밀번호 없이 로그인해요.</p>
                        <th:block th:unless="${loginMember.social}">
                            <div class="field">
                                <label for="memberPassword">현재 비밀번호<span class="opt">비밀번호 변경 시</span></label>
                                <input type="password" id="memberPassword" name="memberPassword" autocomplete="current-password">
                            </div>
                            <div class="field">
                                <label for="memberNewPassword">새 비밀번호<span class="opt">8자 이상, 비우면 유지</span></label>
                                <input type="password" id="memberNewPassword" name="memberNewPassword" minlength="8" autocomplete="new-password">
                            </div>
                        </th:block>

                        <div class="form-actions">
                            <a th:href="@{/mypage}" class="btn btn-line">취소</a>
                            <button type="submit" class="btn btn-primary">저장하기</button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="withdraw-link"><a th:href="@{/mypage/withdraw}">회원 탈퇴</a></p>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/frontend/src/pages/photomap/profile-image.js}"></script>

</body>
</html>
