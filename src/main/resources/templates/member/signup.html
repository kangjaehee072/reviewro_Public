<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="main">
    <div class="wrap">
        <div class="auth auth-wide">
            <h1>회원가입</h1>
            <div class="card">
                <div class="card-body">
                    <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>

                    <form id="signupForm" th:action="@{/signup}" th:object="${memberDto}" method="post" enctype="multipart/form-data"
                          th:data-check-url="@{/signup/check}">
                        <div class="profile-row" style="margin-bottom: 20px;">
                            <img id="profilePreview" th:src="@{/img/default-profile.svg}" alt="">
                            <div class="field">
                                <label for="memberProfileImage">프로필 사진<span class="opt">선택</span></label>
                                <input type="file" id="memberProfileImage" th:field="*{memberProfileImage}" accept="image/*">
                            </div>
                        </div>
                        <div class="field" data-check="USER_ID" data-label="아이디">
                            <label for="memberUserId">아이디<span class="req">*</span></label>
                            <input type="text" id="memberUserId" th:field="*{memberUserId}" placeholder="영문, 숫자 4~30자" required minlength="4" maxlength="30" autocomplete="username">
                            <p class="check"></p>
                        </div>
                        <div class="field">
                            <label for="memberPassword">비밀번호<span class="req">*</span></label>
                            <input type="password" id="memberPassword" th:field="*{memberPassword}" placeholder="8자 이상" required minlength="8" autocomplete="new-password">
                        </div>
                        <div class="field" data-check="NICKNAME" data-label="닉네임">
                            <label for="memberNickname">닉네임<span class="req">*</span></label>
                            <input type="text" id="memberNickname" th:field="*{memberNickname}" placeholder="커뮤니티에서 표시될 이름" required maxlength="30">
                            <p class="check"></p>
                        </div>
                        <!-- 이메일은 입력 중 중복 확인을 하지 않는다 (누구나 가입 여부를 알아낼 수 있어서). 가입 버튼을 누를 때 서버가 확인한다 -->
                        <div class="field">
                            <label for="memberEmail">이메일<span class="req">*</span></label>
                            <input type="email" id="memberEmail" th:field="*{memberEmail}" placeholder="example@email.com" required autocomplete="email">
                        </div>
                        <div class="field">
                            <label for="memberPhone">연락처</label>
                            <input type="tel" id="memberPhone" th:field="*{memberPhone}" placeholder="010-0000-0000" autocomplete="tel">
                        </div>
                        <div class="field">
                            <label for="memberAddress">주소</label>
                            <input type="text" id="memberAddress" th:field="*{memberAddress}" placeholder="주소">
                        </div>
                        <!-- 필수 약관 동의 (항목과 내용은 관리자메뉴 > 이용약관 수정에서 바꾼다) -->
                        <div th:replace="~{fragments/terms :: consent(${requiredTerms}, ${siteInfo})}"></div>
                        <button type="submit" class="btn btn-lg btn-primary btn-full" style="margin-top: 8px;">가입하기</button>
                    </form>
                    <th:block th:replace="~{fragments/social :: buttons('또는 간편 가입')}"></th:block>
                </div>
            </div>
            <p class="auth-foot">이미 계정이 있으신가요?<a th:href="@{/login}">로그인</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/frontend/src/pages/photomap/profile-image.js}"></script>
<script th:src="@{/frontend/src/pages/photomap/signup.js}"></script>

</body>
</html>
