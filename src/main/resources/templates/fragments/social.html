<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 소셜 로그인 버튼 (로그인 창·로그인 화면·가입 화면 공용). 동그란 로고 버튼을 한 줄로 늘어놓는다. 모양은 style.css .social-*
     socialProviders: .env 에 키가 있는 제공자 → 누르면 로그인 (처음이면 약관 동의 후 가입)
     socialPending: 심사 중인 제공자 → 버튼만 보이고 안 눌린다 (마우스 올리면 '심사 중') -->
<th:block th:fragment="buttons(label)">
    <div class="social-login"
         th:unless="${#lists.isEmpty(socialProviders) and #lists.isEmpty(socialPending)}">
        <div class="social-divider"><span th:text="${label}">간편 로그인</span></div>

        <div class="social-icons">
            <a th:if="${#lists.contains(socialProviders, 'kakao')}" th:href="@{/oauth2/authorization/kakao}"
               class="social-btn social-kakao" title="카카오로 계속하기" aria-label="카카오로 계속하기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.54 2 10.9c0 2.82 1.87 5.3 4.69 6.7l-.95 3.5c-.09.32.27.57.55.39l4.17-2.76c.5.06 1.02.1 1.54.1 5.52 0 10-3.54 10-7.93S17.52 3 12 3z"/></svg>
            </a>

            <a th:if="${#lists.contains(socialProviders, 'naver')}" th:href="@{/oauth2/authorization/naver}"
               class="social-btn social-naver" title="네이버로 계속하기" aria-label="네이버로 계속하기">
                <svg th:replace="~{fragments/social :: naverLogo}"></svg>
            </a>
            <button th:if="${#lists.contains(socialPending, 'naver')}" type="button"
                    class="social-btn social-naver is-pending" aria-disabled="true" data-pending="네이버 (심사중)"
                    aria-label="네이버 로그인 (심사중)">
                <svg th:replace="~{fragments/social :: naverLogo}"></svg>
            </button>

            <a th:if="${#lists.contains(socialProviders, 'google')}" th:href="@{/oauth2/authorization/google}"
               class="social-btn social-google" title="Google로 계속하기" aria-label="Google로 계속하기">
                <svg th:replace="~{fragments/social :: googleLogo}"></svg>
            </a>
            <button th:if="${#lists.contains(socialPending, 'google')}" type="button"
                    class="social-btn social-google is-pending" aria-disabled="true" data-pending="Google (심사중)"
                    aria-label="Google 로그인 (심사중)">
                <svg th:replace="~{fragments/social :: googleLogo}"></svg>
            </button>
        </div>
    </div>
</th:block>

<!-- 로고 (위 버튼들이 가져다 쓴다) -->
<svg th:fragment="naverLogo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15.56 12.83 8.2 2.25H2.25v19.5h6.19V11.17l7.36 10.58h5.95V2.25h-6.19z"/></svg>

<svg th:fragment="googleLogo" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81z"/>
    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3.01c-1.07.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.72-4.95H1.27v3.11A12 12 0 0 0 12 24z"/>
    <path fill="#FBBC05" d="M5.28 14.28a7.2 7.2 0 0 1 0-4.56V6.61H1.27a12 12 0 0 0 0 10.78l4.01-3.11z"/>
    <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.44-3.44A11.97 11.97 0 0 0 12 0 12 12 0 0 0 1.27 6.61l4.01 3.11C6.22 6.88 8.87 4.77 12 4.77z"/>
</svg>

</html>
