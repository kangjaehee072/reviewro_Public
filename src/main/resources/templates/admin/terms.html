<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('이용약관 수정')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('관리자메뉴')}"></header>

<main class="main">
    <div class="wrap admin-layout">

        <aside th:replace="~{fragments/admin-menu :: menu('terms')}"></aside>

        <div class="terms-admin">
            <div class="page-head">
                <div>
                    <h1>이용약관 수정</h1>
                    <p>회원가입 동의 화면과 <a th:href="@{/terms}" target="_blank">약관 페이지</a>에 그대로 나와요.
                        '가입 시 필수 동의' 를 켠 항목은 가입할 때 체크해야 가입돼요.</p>
                </div>
            </div>

            <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="notice notice-ok" th:text="${successMessage}"></div>

            <!-- 운영 정보 · 개인정보 보호책임자 -->
            <form class="card" th:action="@{/admin/terms/info}" method="post">
                <div class="card-head">운영 정보 · 개인정보 보호책임자</div>
                <div class="card-body">
                    <p class="hint">비워 둔 칸은 약관 화면에서 그 줄째 숨겨져요. (예: 연락처를 비우면 연락처 줄이 안 나와요)</p>
                    <div class="terms-admin-grid">
                        <div class="field"><label>운영자(상호)</label>
                            <input type="text" name="operatorName" maxlength="100" th:value="${siteInfo.operatorName}"></div>
                        <div class="field"><label>시행일</label>
                            <input type="date" name="effectiveDate" th:value="${siteInfo.effectiveDate}"></div>
                        <div class="field"><label>보호책임자 이름</label>
                            <input type="text" name="officerName" maxlength="50" th:value="${siteInfo.officerName}"></div>
                        <div class="field"><label>직책</label>
                            <input type="text" name="officerPosition" maxlength="50" th:value="${siteInfo.officerPosition}"></div>
                        <div class="field"><label>연락처</label>
                            <input type="text" name="officerPhone" maxlength="30" th:value="${siteInfo.officerPhone}"></div>
                        <div class="field"><label>이메일</label>
                            <input type="email" name="officerEmail" maxlength="100" th:value="${siteInfo.officerEmail}"></div>
                    </div>
                    <div class="form-actions"><button type="submit" class="btn btn-primary">운영 정보 저장</button></div>
                </div>
            </form>

            <!-- 약관 항목들 (항목마다 따로 저장) -->
            <form th:each="s : ${sections}" class="card terms-admin-section" th:action="@{/admin/terms/sections}" method="post">
                <input type="hidden" name="id" th:value="${s.termsSectionId}">
                <div class="card-body">
                    <div class="terms-admin-row">
                        <div class="field" style="flex: 1"><label>제목</label>
                            <input type="text" name="title" maxlength="100" required th:value="${s.title}"></div>
                        <div class="field" style="width: 90px"><label>순서</label>
                            <input type="number" name="sortOrder" th:value="${s.sortOrder}"></div>
                        <label class="terms-check terms-admin-required">
                            <input type="checkbox" name="requiredOnSignup" value="true" th:checked="${s.requiredOnSignup}">
                            <span>가입 시 필수 동의</span>
                        </label>
                    </div>
                    <div class="field"><label>내용</label>
                        <textarea name="content" rows="12" required th:text="${s.content}"></textarea></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-danger btn-sm" th:formaction="@{/admin/terms/sections/{id}/delete(id=${s.termsSectionId})}"
                                formnovalidate data-confirm="이 항목을 지울까요? 가입 화면과 약관 페이지에서 사라져요.">삭제</button>
                        <button type="submit" class="btn btn-primary btn-sm">이 항목 저장</button>
                    </div>
                </div>
            </form>

            <!-- 새 항목 -->
            <form class="card terms-admin-section" th:action="@{/admin/terms/sections}" method="post">
                <div class="card-head">새 항목 추가</div>
                <div class="card-body">
                    <div class="terms-admin-row">
                        <div class="field" style="flex: 1"><label>제목</label>
                            <input type="text" name="title" maxlength="100" required placeholder="예: 위치기반서비스 이용약관"></div>
                        <div class="field" style="width: 90px"><label>순서</label>
                            <input type="number" name="sortOrder" th:value="${#lists.size(sections) + 1}"></div>
                        <label class="terms-check terms-admin-required">
                            <input type="checkbox" name="requiredOnSignup" value="true">
                            <span>가입 시 필수 동의</span>
                        </label>
                    </div>
                    <div class="field"><label>내용</label>
                        <textarea name="content" rows="8" required></textarea></div>
                    <div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">추가</button></div>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    // 삭제는 한 번 더 묻는다
    document.querySelectorAll('[data-confirm]').forEach((btn) => {
        btn.addEventListener('click', (e) => { if (!confirm(btn.dataset.confirm)) e.preventDefault(); });
    });
    window.lucide && lucide.createIcons();
</script>
</body>
</html>
