<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('여행 리뷰')}"></head>
<link rel="stylesheet" th:href="@{/css/board.css}">
<body>
<header th:replace="~{fragments/layout :: header('community')}"></header>

<main class="main board board-review">
    <div class="wrap">

        <section class="board-hero">
            <div class="board-hero-icon"><i data-lucide="star" class="ico ico-lg"></i></div>
            <div class="board-hero-text">
                <span class="board-eyebrow">리얼 후기</span>
                <h1>여행 리뷰</h1>
                <p>직접 다녀온 여행지·맛집·숙소의 솔직한 별점과 후기를 나눠요</p>
            </div>
            <div class="board-hero-actions">
                <a th:href="@{/review/insert}" class="btn btn-board">
                    <i data-lucide="pen-line" class="ico"></i>리뷰 쓰기
                </a>
            </div>
        </section>

        <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="notice notice-ok" th:text="${successMessage}"></div>

        <div class="board-toolbar">
            <span class="board-count">전체 <b th:text="${reviews.totalElements}">0</b>개</span>
            <form class="board-search" th:action="@{/review/list}" method="get" role="search">
                <i data-lucide="search" class="ico"></i>
                <input type="search" name="keyword" th:value="${keyword}" placeholder="제목·지역으로 검색">
                <button type="submit">검색</button>
            </form>
        </div>

        <div class="card board-list">
            <div th:if="${reviews.empty}" class="board-empty">
                <div class="board-empty-icon"><i data-lucide="star" class="ico ico-lg"></i></div>
                <p th:text="${keyword != null and !keyword.isBlank()} ? '검색 결과가 없어요.' : '아직 등록된 리뷰가 없어요. 첫 리뷰를 남겨 보세요!'">
                    아직 등록된 리뷰가 없어요.</p>
                <a th:href="@{/review/insert}" class="btn btn-board btn-sm">리뷰 쓰기</a>
            </div>

            <table class="table" th:unless="${reviews.empty}">
                <thead>
                <tr>
                    <th class="num col-hide">번호</th>
                    <th>리뷰</th>
                    <th class="center">별점</th>
                    <th class="center col-hide">작성자</th>
                    <th class="center col-hide">작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reviews.content}">
                    <td class="num col-hide" th:text="${r.reviewId}">1</td>
                    <td>
                        <a class="post-cell" th:href="@{/review/read/{id}(id=${r.reviewId})}">
                            <img th:if="${r.thumbnail != null}" th:src="${r.thumbnail}" class="post-cell-thumb" alt="">
                            <span class="post-cell-text">
                                <span class="post-cell-title" th:text="${r.reviewTitle}">리뷰 제목</span>
                                <span class="post-cell-subline">
                                    <span class="post-cell-sub"
                                          th:text="${(r.reviewCategory ?: '리뷰') + ' · ' + (r.reviewArea ?: '') + ' ' + (r.reviewLocation ?: '')}">국내여행 · 부산 해운대</span>
                                    <span class="post-cell-likes"><i data-lucide="heart" class="ico"></i><span th:text="${r.likeCount}">0</span></span>
                                </span>
                            </span>
                        </a>
                    </td>
                    <td class="center nowrap">
                        <span th:if="${r.reviewStarRating != null and r.reviewStarRating > 0}" class="rate">
                            <i data-lucide="star" class="ico"></i><span th:text="${#numbers.formatDecimal(r.reviewStarRating, 1, 1)}">4.5</span>
                        </span>
                        <span th:unless="${r.reviewStarRating != null and r.reviewStarRating > 0}" class="rate-none">-</span>
                    </td>
                    <td class="center col-hide" th:text="${r.reviewUser}">작성자</td>
                    <td class="center nowrap col-hide" th:text="${r.reviewDate}">2026-03-30</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="pager" th:if="${reviews.totalPages > 1}"
             th:with="blockSize=10,
              start=${(reviews.number / blockSize) * blockSize},
              end=${((start + blockSize - 1) < reviews.totalPages) ? (start + blockSize - 1) : (reviews.totalPages - 1)}">

            <a th:if="${!reviews.first}"
               th:href="@{/review/list(keyword=${keyword}, page=${reviews.number - 1})}">이전</a>
            <span th:unless="${!reviews.first}" class="off">이전</span>

            <th:block th:each="i : ${#numbers.sequence(start, end)}">
                <span th:if="${i == reviews.number}" class="on" th:text="${i + 1}">1</span>
                <a th:unless="${i == reviews.number}"
                   th:href="@{/review/list(keyword=${keyword}, page=${i})}" th:text="${i + 1}">2</a>
            </th:block>

            <a th:if="${!reviews.last}"
               th:href="@{/review/list(keyword=${keyword}, page=${reviews.number + 1})}">다음</a>
            <span th:unless="${!reviews.last}" class="off">다음</span>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/board :: icons}"></th:block>
</body>
</html>
