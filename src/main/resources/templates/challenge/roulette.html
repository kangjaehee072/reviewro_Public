<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('랜덤 챌린지 룰렛')}">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

<header th:replace="~{fragments/layout :: header('contents')}"></header>

<main class="max-w-4xl mx-auto px-4 py-12 flex flex-col items-center justify-center flex-1 w-full text-center">

  <!-- Title -->
  <div class="mb-8">
    <span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Random Challenge</span>
    <h1 class="text-3xl font-extrabold mt-3 text-white">행운의 룰렛을 돌려보세요! 🎯</h1>
    <p class="text-slate-400 text-xs sm:text-sm mt-1">오늘 당신을 위해 준비된 특별한 여행 미션은 무엇일까요?</p>
  </div>

  <!-- 룰렛 영역 -->
  <div class="relative flex items-center justify-center my-4">
    <!-- 상단 화살표 화살표 표시 (화살표가 가리키는 곳이 당첨) -->
    <div class="absolute -top-5 z-20 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[25px] border-t-amber-400 filter drop-shadow-lg"></div>

    <!-- Canvas 룰렛 판 -->
    <canvas id="roulette-canvas" width="380" height="380" class="rounded-full shadow-2xl border-4 border-slate-800 bg-slate-900"></canvas>
  </div>

  <!-- 돌리기 버튼 -->
  <button id="spin-btn" onclick="spinRoulette()" class="mt-8 px-8 py-3.5 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-extrabold text-base rounded-2xl shadow-lg shadow-amber-500/20 transform hover:scale-105 active:scale-95 transition-all flex items-center gap-2 cursor-pointer">
    <i data-lucide="trophy" class="w-5 h-5"></i>
    <span>룰렛 돌리기!</span>
  </button>

</main>

<!-- 당첨 결과 모달 -->
<div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl animate-in fade-in zoom-in duration-300">
    <div class="w-16 h-16 bg-amber-500/20 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto text-amber-400">
      <i data-lucide="party-popper" class="w-8 h-8"></i>
    </div>
    <div>
      <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">오늘의 챌린지 당첨!</span>
      <h3 id="result-title" class="text-xl font-bold text-white mt-1">챌린지 제목</h3>
      <p id="result-desc" class="text-xs text-slate-400 mt-2 line-clamp-3">챌린지 설명 문구</p>
    </div>
    <div class="pt-2 flex gap-2">
      <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition-colors">다시 돌리기</button>
      <a id="result-link" href="#" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold rounded-xl transition-colors">도전하기 →</a>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- 룰렛 동작 스크립트 -->
<script th:inline="javascript">
  /* Thymeleaf로 전달받은 챌린지 리스트 */
  const challenges = /*[[${challengeList}]]*/ [
    { challengeId: 1, challengeName: '단풍 명소 인증하기', challengeDescription: '가을 단풍 스팟에서 인생샷 찍기' },
    { challengeId: 2, challengeName: '전통시장 맛집 탐방', challengeDescription: '지역 로컬 시장에서 맛있는 한 끼' },
    { challengeId: 3, challengeName: '플로깅 여행', challengeDescription: '여행지에서 쓰레기 줍기 봉사' },
    { challengeId: 4, challengeName: '야경 명소 방문', challengeDescription: '밤하늘 가득 야경 감상하기' }
  ];

  const canvas = document.getElementById('roulette-canvas');
  const ctx = canvas.getContext('2d');
  const colors = ['#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];

  let currentAngle = 0;
  let isSpinning = false;

  // 룰렛 그리기
  function drawRoulette() {
    if (!challenges || challenges.length === 0) return;
    const numOptions = challenges.length;
    const arcSize = (2 * Math.PI) / numOptions;
    const radius = canvas.width / 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < numOptions; i++) {
      const angle = currentAngle + i * arcSize;

      // 조각 그리기
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(radius, radius);
      ctx.arc(radius, radius, radius - 10, angle, angle + arcSize);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      // 텍스트 그리기
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(angle + arcSize / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px Pretendard, sans-serif";

      // 글자 길이 자르기
      let name = challenges[i].challengeName;
      if (name.length > 8) name = name.substring(0, 8) + '...';

      ctx.fillText(name, radius - 25, 5);
      ctx.restore();
    }
  }

  // 룰렛 돌리기 애니메이션
  function spinRoulette() {
    if (isSpinning || challenges.length === 0) return;
    isSpinning = true;

    const spinAngle = Math.floor(Math.random() * 360) + 1800; // 최소 5바퀴 + 랜덤
    const duration = 4000; // 4초
    const start = performance.now();

    function animate(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);

      // easeOutCubic 감속 효과
      const easeOut = 1 - Math.pow(1 - progress, 3);
      currentAngle = (spinAngle * (Math.PI / 180)) * easeOut;

      drawRoulette();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        showResult();
      }
    }

    requestAnimationFrame(animate);
  }

  // 결과 표시 모달
  function showResult() {
    const numOptions = challenges.length;
    const arcSize = (2 * Math.PI) / numOptions;

    // 12시 방향(상단 화살표)에 걸린 조각 계산
    const normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const winningIndex = Math.floor(normalizedAngle / arcSize) % numOptions;
    const winner = challenges[winningIndex];

    document.getElementById('result-title').innerText = winner.challengeName;
    document.getElementById('result-desc').innerText = winner.challengeDescription || '설명이 준비 중입니다.';
    document.getElementById('result-link').href = '#' + winner.challengeId;

    document.getElementById('result-modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('result-modal').classList.add('hidden');
  }

  // 최초 룰렛 그리기
  lucide.createIcons();
  drawRoulette();
</script>
</body>
</html>
