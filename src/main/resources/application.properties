spring.application.name=ReviewRo
# DB·카카오·소셜 로그인 키는 .env 에 둔다 (git 에 안 올림, 틀은 src/main/resources/env.example).
# 읽는 .env 는 한 곳뿐: 앱 홈 = jar 로 띄우면 jar 가 있는 폴더, IntelliJ·bootRun 이면 프로젝트 루트.
# 없으면 서버가 시작할 때 그 자리에 빈 틀을 만든다
spring.config.import=optional:file:${app.home}/.env[.properties]
server.port=8080
# 앞단 프록시(Nginx 등)가 https 를 처리하고 앱은 http 로 받는다.
# 프록시가 보내는 X-Forwarded-Proto/Host 를 믿어야 소셜 로그인 돌아올 주소가 https://reviewro.mrpark.pro/... 로 만들어진다
server.forward-headers-strategy=native

# 세션 쿠키. https 로만 받는 서버는 .env 에 SESSION_COOKIE_SECURE=true (http 로 띄우는 로컬은 비워 둔다)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

### DB (주소·계정은 .env) ###
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# 쿼리를 콘솔에 찍으면 요청마다 느려진다. 확인할 때만 잠깐 true 로 바꾼다
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
# 포토맵은 지도 전체를 한 번에 채워 저장할 수 있어 요청 한도를 크게 둔다 (사진은 브라우저에서 FHD·WebP 로 줄여서 온다)
spring.servlet.multipart.max-request-size=2GB
# 한도를 넘은 요청도 끝까지 받아 줘야 "용량 초과" 답을 보낼 수 있다 (기본 2MB 면 연결을 끊어 버려 Failed to fetch 가 된다)
server.tomcat.max-swallow-size=2GB
# 톰캣 기본은 한 요청에 파트 50개까지라 사진을 많이 넣으면 막힌다. 개수 제한은 두지 않는다 (용량 한도로만 막음)
server.tomcat.max-part-count=-1

# 접속 로그: 앱 홈/log 에 하루 한 파일(access.날짜.log), 30일 지나면 삭제. 프록시 뒤 실제 접속 IP 를 남긴다
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${app.home}/log
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.accesslog.max-days=30
server.tomcat.accesslog.encoding=UTF-8
server.tomcat.accesslog.request-attributes-enabled=true
# 표시가 붙은 요청만 남긴다. 맨 끝 칸: 접속 시작(30분 넘게 안 보이다 다시 온 IP 포함) VISIT, 로그인 3회 실패 LOGIN_FAIL_3, 로그인 잠금 LOGIN_LOCKED
server.tomcat.accesslog.condition-if=reviewro.security
server.tomcat.accesslog.pattern=%{yyyy-MM-dd HH:mm:ss}t %a "%r" %s %b "%{User-Agent}i" %{reviewro.security}r

file.upload.dir=${app.home}/data
file.profile.dir=${app.home}/data/profile
file.photomap.dir=${app.home}/data/photomap
file.post.dir=${app.home}/data/post

### 카카오 (값은 .env) ###
key.kakaoREST=${KAKAO_REST_KEY:}
key.kakaoJavaScript=${KAKAO_JAVASCRIPT_KEY:}
key.kakaoNative=${KAKAO_NATIVE_KEY:}

### 소셜 로그인 (값은 .env, 비어 있는 곳은 로그인 버튼이 안 나온다) ###
# 로그인 후 돌아올 주소의 앞부분. 비우면 요청 주소를 그대로 쓰고, 포트 릴레이로 https 를 받는 서버는 .env 에 실제 주소를 넣는다
social.redirect-base=${SOCIAL_REDIRECT_BASE:}
social.kakao.client-id=${KAKAO_REST_KEY:}
social.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
social.google.client-id=${GOOGLE_CLIENT_ID:}
social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
social.naver.client-id=${NAVER_CLIENT_ID:}
social.naver.client-secret=${NAVER_CLIENT_SECRET:}
# 심사 중인 제공자: 버튼은 보이지만 눌리지 않고(마우스 올리면 '심사 중'), 서버도 로그인 주소를 막는다.
# 심사가 끝나면 여기서 빼면 된다 (예: 둘 다 끝나면 social.pending= 로 비움)
social.pending=google,naver

### AI (Ollama 주소·모델명은 .env) ###
ai.endpoint=${OLLAMA_ENDPOINT}
ai.model=${OLLAMA_MODEL}
ai.num-ctx=8192
ai.num-predict=8192
# Claude API (키는 .env 의 ANTHROPIC_API_KEY). 어느 쪽을 쓸지는 슈퍼어드민이 /admin/ai 에서 고른다
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.model=claude-opus-5-5