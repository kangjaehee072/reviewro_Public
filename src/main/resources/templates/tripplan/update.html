<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('공유 일정 수정')}"></head>
<link rel="stylesheet" th:href="@{/css/board.css}">
<body>
<header th:replace="~{fragments/layout :: header('community')}"></header>

<main class="main board board-market">
    <div class="wrap">
        <div class="board-form">

            <a th:href="@{/tripplan/read/{id}(id=${tripPlanDto.tripplanId})}" class="back-link">
                <i data-lucide="chevron-left" class="ico"></i>일정으로 돌아가기
            </a>
            <div class="board-form-head">
                <h1>공유 일정 수정</h1>
            </div>

            <div th:if="${errorMessage}" class="notice notice-error" th:text="${errorMessage}"></div>

            <form class="card" th:action="@{/tripplan/update}" th:object="${tripPlanDto}" method="post">
                <input type="hidden" th:field="*{tripplanId}">

                <section class="form-section">
                    <h2 class="form-section-title"><i data-lucide="file-text" class="ico"></i>소개</h2>

                    <div class="field">
                        <label for="tripplanTitle">제목<span class="req">*</span></label>
                        <input type="text" id="tripplanTitle" th:field="*{tripplanTitle}" required>
                    </div>

                    <div class="field">
                        <label for="tripplanContent">소개<span class="req">*</span></label>
                        <textarea id="tripplanContent" th:field="*{tripplanContent}" rows="5" required></textarea>
                    </div>

                    <label class="toggle-row" for="tripplanIsPublic">
                        <input type="checkbox" id="tripplanIsPublic" th:field="*{tripplanIsPublic}">
                        <span><b>마켓에 공개</b><small>끄면 나만 볼 수 있어요</small></span>
                    </label>
                </section>

                <section class="form-section">
                    <div class="row-between">
                        <h2 class="form-section-title"><i data-lucide="calendar-days" class="ico"></i>일정</h2>
                        <button type="button" class="btn btn-sm btn-board" onclick="addDay()">
                            <i data-lucide="plus" class="ico"></i>일자 추가
                        </button>
                    </div>

                    <div id="dayContainer">
                        <!-- 저장돼 있던 일자 / 장소 -->
                        <div th:each="day, dayStat : *{tripDays}" class="day-editor">
                            <input type="hidden" th:field="*{tripDays[__${dayStat.index}__].tripDayId}">

                            <div class="day-editor-head">
                                <div class="field">
                                    <label>일자</label>
                                    <input type="text" required
                                           th:field="*{tripDays[__${dayStat.index}__].tripDayNumber}">
                                </div>
                                <div class="btns">
                                    <button type="button" class="btn btn-sm btn-line"
                                            th:onclick="'addPlace(this, ' + ${dayStat.index} + ')'">
                                        <i data-lucide="map-pin-plus" class="ico"></i>장소 추가</button>
                                    <button type="button" class="btn btn-sm btn-danger-ghost"
                                            onclick="removeBox(this, '.day-editor')">
                                        <i data-lucide="trash-2" class="ico"></i>일자 삭제</button>
                                </div>
                            </div>

                            <div class="place-list">
                                <div th:each="place, placeStat : ${day.tripPlaces}" class="place-editor">
                                    <input type="hidden"
                                           th:field="*{tripDays[__${dayStat.index}__].tripPlaces[__${placeStat.index}__].tripPlaceId}">
                                    <div class="field">
                                        <label>장소 번호</label>
                                        <input type="number" placeholder="장소 ID"
                                               th:field="*{tripDays[__${dayStat.index}__].tripPlaces[__${placeStat.index}__].locationId}">
                                    </div>
                                    <div class="field">
                                        <label>순서</label>
                                        <input type="text"
                                               th:field="*{tripDays[__${dayStat.index}__].tripPlaces[__${placeStat.index}__].tripPlaceSequence}">
                                    </div>
                                    <div class="field">
                                        <label>메모</label>
                                        <input type="text" placeholder="예: 해운대 해수욕장 산책"
                                               th:field="*{tripDays[__${dayStat.index}__].tripPlaces[__${placeStat.index}__].tripPlaceMemo}">
                                    </div>
                                    <button type="button" class="btn btn-sm btn-danger-ghost"
                                            onclick="removeBox(this, '.place-editor')" aria-label="장소 삭제">
                                        <i data-lucide="x" class="ico"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="board-form-foot">
                    <a th:href="@{/tripplan/read/{id}(id=*{tripplanId})}" class="btn btn-line">취소</a>
                    <button type="submit" class="btn btn-board"><i data-lucide="check" class="ico"></i>수정 완료</button>
                </div>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/tripplan-editor.js}"></script>
<th:block th:replace="~{fragments/board :: icons}"></th:block>
</body>
</html>
